# Checks pull requests and the merge queue of main: private data, build against the game references and unit tests on
# every run. Game tests in the headless sim (tools/headless-sim) on Linux: in the merge queue, the set of the group's pull
# requests (scripts/ci-test-set.sh); every test in manual and scheduled runs (the full-suite check). Tests with the line
# "# runner: pc" need the Windows PC: the PR owner runs the affected ones (LIST_ONLY=1 RUNNER=pc
# scripts/autotest-affected.sh) and ticks the PR template's box.
# Game files: the private repo Yarden-zamir/cosmoteer-hot-cargo-game-refs (read-only deploy key). Only runs of this repo
# get the key (pull requests from forks do not); never pull_request_target. Game files never go into a cache or an artifact.
name: check
on:
  # No push trigger: main moves only through the merge queue, and main gets the exact commit that the queue tested, with
  # its checks. release.sh reads those checks. dev-release.yml has its own trigger.
  # "edited": a change of the pull request text checks its "### Game tests" block again.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # The merge queue of main: it tests each pull request on top of main and the pull requests ahead of it.
  merge_group:
    types: [checks_requested]
  # A full run of a branch on request (gh workflow run check.yml --ref <branch>), for example before a risky pull request
  # enters the queue.
  workflow_dispatch:
  # The safety net: every game test on main, so that a break that the smaller queue sets skip stays short. It skips a main
  # commit that already has a green full-suite check. Revisit the interval if main moves much faster or slower.
  schedule:
    - cron: "17 */3 * * *"
# A newer push to a pull request cancels its older run. Merge queue groups and manual runs are never cancelled.
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/check-private.sh
  build:
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets, so they cannot read the private game references.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      game-tests: ${{ steps.scope.outputs.game-tests }}
      tests: ${{ steps.scope.outputs.tests }}
      shards: ${{ steps.scope.outputs.shards }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7.0.1
      # The game test set (scripts/ci-test-set.sh). A pull request run checks its "### Game tests" block and shows the set
      # that the queue will run; it runs no game test. A merge queue group runs the union of its pull requests' sets.
      # Manual runs and the schedule run every test; the schedule skips a commit that has a green full-suite check.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          run=true
          case "${{ github.event_name }}" in
            pull_request) scripts/ci-test-set.sh "$PR" > set.txt; run=false ;;
            merge_group) scripts/ci-test-set.sh --group "$QUEUE_BASE" "$QUEUE_HEAD" > set.txt ;;
            workflow_dispatch) scripts/ci-test-set.sh --all > set.txt ;;
            schedule)
              done="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=full-suite" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
              if (( done > 0 )); then printf '== main %s has a green full suite\nTESTS \nSHARDS 0\nFULL no\n' "$GITHUB_SHA" > set.txt
              else scripts/ci-test-set.sh --all > set.txt; fi ;;
            *) echo "check: unexpected event ${{ github.event_name }}"; exit 1 ;;
          esac
          cat set.txt
          tests="$(sed -n 's/^TESTS //p' set.txt)" shards="$(sed -n 's/^SHARDS //p' set.txt)"
          [[ "$run" == true && -n "$tests" ]] || run=false
          { echo "### Game tests"; echo; grep '^== ' set.txt | sed 's/^== /- /'
            if [[ "${{ github.event_name }}" == pull_request ]]; then echo; echo "The merge queue runs this set for this pull request."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          { echo "game-tests=$run"; echo "tests=$tests"; echo "shards=$(jq -cn --argjson n "$shards" '[range(1; $n + 1)]')"
            echo "full=$(sed -n 's/^FULL //p' set.txt | sed 's/yes/true/; s/no/false/')"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: Yarden-zamir/cosmoteer-hot-cargo-game-refs
          ssh-key: ${{ secrets.GAME_REFS_DEPLOY_KEY }}
          path: .game-refs
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build src/HotCargo/HotCargo.csproj -c Release -nologo -v quiet
        env:
          CosmoteerBin: ${{ github.workspace }}/.game-refs/Bin
      - run: dotnet run --project tests/HotCargo.Tests
  # The game tests of the set, split over a few full jobs (scripts/ci-sim-tests.sh). A runner has 4 cores and 16 GB, and one
  # sim takes about one core and 2 GB, so each job runs 4 sims at once. The set decides the job count, at most 6
  # (scripts/ci-test-set.sh): two merge queue groups fit in the ~20 parallel jobs of the free plan.
  game-tests-shard:
    runs-on: ubuntu-latest
    # After build, so that the cheap required checks never wait in the job queue behind the shards. Forks: no secrets, no run.
    needs: build
    if: needs.build.outputs.game-tests == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      # The repo in repo/ and the game files in .game/, so that the scripts find ../.game as on a developer machine.
      - uses: actions/checkout@v7.0.1
        with:
          path: repo
      - uses: actions/checkout@v7.0.1
        with:
          repository: Yarden-zamir/cosmoteer-hot-cargo-game-refs
          ssh-key: ${{ secrets.GAME_REFS_DEPLOY_KEY }}
          path: .game
      # Windows and macOS ignore letter case in file names, and the vanilla rules rely on that (for example
      # <tractor_Beam.rules> for tractor_beam.rules). So the game files go on an ext4 folder with case folding.
      - name: Game files on a case-insensitive folder
        run: |
          truncate -s 2G "$RUNNER_TEMP/game.img"
          mkfs.ext4 -q -O casefold "$RUNNER_TEMP/game.img"
          sudo mkdir /mnt/game
          sudo mount -o loop "$RUNNER_TEMP/game.img" /mnt/game
          sudo chown "$(id -u):$(id -g)" /mnt/game
          mkdir /mnt/game/files
          chattr +F /mnt/game/files
          cp -a .game/Bin .game/Data .game/StandardMods /mnt/game/files/
          rm -rf .game
          ln -s /mnt/game/files .game
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: repo/global.json
      - name: Game tests, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        working-directory: repo
        env:
          HOT_CARGO_SIM_JOBS: "4"
          CI_TESTS: ${{ needs.build.outputs.tests }}
        run: scripts/ci-sim-tests.sh ${{ matrix.shard }} ${{ strategy.job-total }}
      # Only text logs, checked for game data (scripts/ci-check-logs.sh); never the game files or the staged mod.
      - name: Collect logs
        if: always()
        working-directory: repo
        run: scripts/ci-check-logs.sh "${{ github.workspace }}/.state/logs" "${{ runner.temp }}/logs"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: game-test-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs
          retention-days: 7
          if-no-files-found: ignore
  # One stable check name for branch protection: passes only when every shard passed, or when build passed and found
  # that the change needs no game tests.
  game-tests:
    runs-on: ubuntu-latest
    needs: [build, game-tests-shard]
    # always(): a failed build skips the shards, and this job then fails instead of being skipped.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Tests outside CI that this pull request touches
        if: github.event_name == 'pull_request'
        run: |
          list="$(LIST_ONLY=1 RUNNER=pc COMMITTED_ONLY=1 scripts/autotest-affected.sh "origin/${{ github.base_ref }}" | tail -1)"
          { echo "### Tests outside CI"; echo; echo "${list#== affected (runner pc): }"; echo
            echo 'Run them on the PC when the merge depends on them: `scripts/autotest-all.sh 400 <names>`.'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$list"
      - name: Result of the shards
        run: |
          echo "build: ${{ needs.build.result }}, game tests needed: ${{ needs.build.outputs.game-tests }}, shards: ${{ needs.game-tests-shard.result }}"
          [[ "${{ needs.game-tests-shard.result }}" == success ]] || [[ "${{ needs.build.result }}" == success &&
            "${{ needs.build.outputs.game-tests }}" == false && "${{ needs.game-tests-shard.result }}" == skipped ]]
  # The full-suite check: only when the run takes every game test (manual and scheduled runs, or a group that needs all).
  # release.sh needs it green on the released commit. A failure on main shows as a red check on the commit.
  full-suite:
    runs-on: ubuntu-latest
    needs: [build, game-tests-shard]
    # Never on pull_request runs: they skip the game tests, even when a check.yml change asks for all of them.
    if: always() && needs.build.outputs.full == 'true' && github.event_name != 'pull_request'
    steps:
      - name: Result of the full suite
        run: |
          result="${{ needs.game-tests-shard.result }}"
          { echo "### Full suite"; echo
            if [[ "$result" == success ]]; then echo "Every CI game test passed on ${GITHUB_SHA:0:9}."
            else echo "**The full suite failed on ${GITHUB_SHA:0:9}** (shards: $result). The game-test-logs artifacts hold the logs."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$result" == success ]]
